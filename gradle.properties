# ── 公共元数据（可提交）──────────────────────────────────────────────────────
GROUP=io.github.fellow99
# CLI 制品版本 = 工具上游版本 = Maven 坐标 version（独立 semver，见 docs/000-工程规划.md）。
# 多版本发布：-PCLI_VERSION=<uv 版本>（见 uv-cli.lock.json 的 releases）。
# 2026-11-03 M1 开工钉选：uv 0.13.6（官方最新稳定版，规划 §2 回写）；首产后 lock 回写事实。
CLI_VERSION=0.13.6
POM_NAME=uv-cli
POM_DESCRIPTION=uv command-line executable (libuv_cli.so) for Android arm64-v8a - Rust cross-compiled (aarch64-linux-android) from the official uv source, TLS via rustls bundled roots
POM_URL=https://github.com/fellow99/aosp-uv-cli
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_SCM_CONNECTION=scm:git:git://github.com/fellow99/aosp-uv-cli.git
POM_SCM_DEVELOPMENT_CONNECTION=scm:git:git://github.com/fellow99/aosp-uv-cli.git
POM_DEVELOPER_ID=fellow99
POM_DEVELOPER_NAME=fellow99

# 发布门禁（默认关；真实发布时 RELEASE=true + 用户级 gradle.properties 提供 Token/GPG）
RELEASE=false
